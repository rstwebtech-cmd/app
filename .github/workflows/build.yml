name: Build app
on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "Render backend URL (https://....onrender.com)"
        required: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: cd app && flutter create . --platforms=android,web && flutter pub get
      - run: cd app && flutter build web --release --dart-define=API=${{ github.event.inputs.api_url }}
      - run: cd app && flutter build apk --release --dart-define=API=${{ github.event.inputs.api_url }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: janhavi-app
          path: |
            app/build/app/outputs/flutter-apk/app-release.apk
            app/build/web
